name: verify-public-package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -X utf8 -B scripts/verify.py --profile manifest
      - run: python -X utf8 -B scripts/verify.py --profile core
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -X utf8 -B scripts/verify_advances.py --optimized

  isolated-and-git:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -X utf8 -B scripts/verify.py --profile full
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
